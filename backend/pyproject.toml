[project]
name = "medrecord-backend"
version = "0.1.0"
description = "MedRecord SaaS — Expediente Clínico Electrónico (NOM-004 + NOM-024)"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "mangum>=0.17",             # Lambda adapter for FastAPI
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",            # Async PostgreSQL driver
    "alembic>=1.13",
    "pydantic>=2.6",
    "pydantic-settings>=2.1",
    "boto3>=1.34",
    "cryptography>=42.0",       # AES-GCM for envelope encryption
    "tenacity>=8.2",            # Retry patterns
    "PyJWT>=2.8",               # JWT issuance + validation
    "bcrypt>=4.0",              # Password hashing
    "email-validator>=2.0",     # Pydantic EmailStr support
    "httpx>=0.27",              # Async HTTP client
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "httpx>=0.27",              # For TestClient
    "moto[all]>=5.0",           # Mock AWS services
    "ruff>=0.3",
    "mypy>=1.8",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "S", "B"]
ignore = ["S101"]  # Allow assert in tests

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.mypy]
python_version = "3.12"
strict = true
