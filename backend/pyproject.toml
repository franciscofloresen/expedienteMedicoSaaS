[project]
name = "medrecord-backend"
version = "0.1.0"
description = "MedRecord SaaS — Expediente Clínico Electrónico (NOM-004 + NOM-024)"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "mangum>=0.17",             # Lambda adapter for FastAPI
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",            # Async PostgreSQL driver
    "alembic>=1.13",
    "pydantic>=2.6",
    "pydantic-settings>=2.1",
    "boto3>=1.34",
    "cryptography>=42.0",       # AES-GCM for envelope encryption
    "tenacity>=8.2",            # Retry patterns
    "PyJWT>=2.8",               # JWT issuance + validation
    "email-validator>=2.0",     # Pydantic EmailStr support
    "httpx>=0.27",              # Async HTTP client
    "slowapi>=0.1.9",           # Rate limiting for auth endpoints
    "python-json-logger>=3.0",  # Structured JSON logging for CloudWatch
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "httpx>=0.27",              # For TestClient
    "moto[all]>=5.0",           # Mock AWS services
    "ruff>=0.3",
    "mypy>=1.8",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "S", "B"]
ignore = ["S101", "E712"]  # Allow assert in tests, E712 for SQLAlchemy == True

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Security"]

[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["pydantic.validator", "pydantic.field_validator"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.mypy]
python_version = "3.12"
strict = true
