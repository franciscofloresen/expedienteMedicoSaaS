<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Mantenimiento — CloudMedRecord</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Serif+Display&display=swap"
      rel="stylesheet"
    />
    <!--
      Static maintenance page — mirrors the CloudMedRecord design system
      (dark "instrument-panel" theme, index.css tokens). During a deploy the
      CD workflow uploads this file to S3 as index.html; the final frontend
      step restores the real app. Google Fonts match the app, with system
      fallbacks if they fail to load.
    -->
    <style>
      :root {
        --color-bg: #0d1117;
        --color-surface: #161b22;
        --color-surface-2: #1c222b;
        --color-border: #21262d;
        --color-primary: #00c2b8;
        --color-primary-tint: rgba(0, 194, 184, 0.1);
        --color-gold: #d4a843;
        --color-text: #e6edf3;
        --color-muted: #7d8590;
        --font-sans: "Inter", system-ui, -apple-system, sans-serif;
        --font-serif: "DM Serif Display", Georgia, serif;
        --radius-md: 8px;
        --radius-lg: 12px;
        --radius-xl: 16px;
        --shadow-glass: 0 8px 24px rgba(0, 0, 0, 0.5);
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }
      html { font-size: 14px; }
      html, body { height: 100%; }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100%;
        padding: 1.5rem;
        font-family: var(--font-sans);
        background-color: var(--color-bg);
        /* Subtle instrument-panel glow, echoing the app's dark surfaces */
        background-image:
          radial-gradient(60rem 60rem at 50% -20%, rgba(0, 194, 184, 0.06), transparent 60%);
        color: var(--color-text);
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }

      .card {
        width: 100%;
        max-width: 440px;
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-xl);
        box-shadow: var(--shadow-glass);
        padding: 2.5rem 2rem;
        text-align: center;
        animation: fadeIn 0.25s ease-out;
      }

      /* Brand lockup — matches the sidebar brand */
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 0.6rem;
        margin-bottom: 2rem;
      }
      .brand-mark {
        width: 40px;
        height: 40px;
        border-radius: var(--radius-md);
        background: var(--color-primary-tint);
        color: var(--color-primary);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .brand-mark svg { width: 22px; height: 22px; }
      .brand-text { text-align: left; line-height: 1.15; }
      .brand-name {
        font-family: var(--font-serif);
        font-size: 1.15rem;
        color: var(--color-text);
      }
      .brand-tag {
        font-size: 0.6rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        color: var(--color-primary);
      }

      .spinner {
        width: 30px;
        height: 30px;
        margin: 0 auto 1.5rem;
        border: 3px solid var(--color-border);
        border-top-color: var(--color-primary);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      h1 {
        font-family: var(--font-serif);
        font-weight: 400;
        font-size: 1.6rem;
        letter-spacing: 0.01em;
        color: var(--color-text);
        margin-bottom: 0.6rem;
      }

      p {
        color: var(--color-muted);
        font-size: 0.95rem;
        margin: 0 auto 0.4rem;
        max-width: 34ch;
      }

      /* Indeterminate progress — signals "work in progress" */
      .progress {
        position: relative;
        height: 3px;
        width: 100%;
        margin: 1.75rem 0 1.5rem;
        background: var(--color-border);
        border-radius: 999px;
        overflow: hidden;
      }
      .progress::after {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 40%;
        border-radius: 999px;
        background: linear-gradient(
          90deg,
          transparent,
          var(--color-primary),
          transparent
        );
        animation: slide 1.4s ease-in-out infinite;
      }

      /* Status badge — matches .badge-draft (teal tint) */
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        padding: 0.2rem 0.7rem;
        border-radius: 999px;
        font-size: 0.72rem;
        font-weight: 600;
        letter-spacing: 0.03em;
        background: var(--color-primary-tint);
        color: var(--color-primary);
        border: 1px solid rgba(0, 194, 184, 0.35);
      }
      .badge .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--color-primary);
        animation: pulse 1.4s ease-in-out infinite;
      }

      .hint {
        margin-top: 1.5rem;
        font-size: 0.8rem;
        color: var(--color-muted);
      }

      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes slide {
        0% { left: -40%; }
        100% { left: 100%; }
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="card" role="status" aria-live="polite">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <!-- Clinical pulse mark, in the app's primary teal -->
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M3 12h3.5l2-6 3.5 12 2.5-8 1.5 2H21"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </span>
        <span class="brand-text">
          <span class="brand-name">CloudMedRecord</span>
          <span class="brand-tag">Expediente Clínico</span>
        </span>
      </div>

      <div class="spinner" aria-hidden="true"></div>

      <h1>Estamos actualizando el sistema</h1>
      <p>Aplicamos mejoras para brindarte un mejor servicio.</p>
      <p>Volveremos en unos minutos.</p>

      <div class="progress" aria-hidden="true"></div>

      <span class="badge"><span class="dot"></span> Mantenimiento en curso</span>

      <p class="hint">
        Tus expedientes y datos clínicos están seguros. Esta página se
        actualizará automáticamente.
      </p>
    </main>

    <script>
      // Reload periodically so users return to the app once the deploy finishes.
      setTimeout(function () { location.reload(); }, 30000);
    </script>
  </body>
</html>
