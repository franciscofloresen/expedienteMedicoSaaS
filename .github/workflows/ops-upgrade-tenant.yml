name: Ops — Upgrade Tenant Plan (Production)

# Cambia el plan de un tenant en producción (vía Lambda en la VPC privada).
# Idempotente: si el médico ya está en el plan indicado, no hace nada.
# Sincroniza el plan en PostgreSQL y en Clerk (public_metadata). El plan surte
# efecto para el médico en su siguiente refresh de token (~60s) o al recargar.

on:
  workflow_dispatch:
    inputs:
      email:
        description: "Correo del médico (deja vacío si usas tenant_id)"
        required: false
        type: string
      tenant_id:
        description: "ID (UUID) del tenant — usar cuando el email es sintético (*.local)"
        required: false
        type: string
      plan:
        description: "Plan destino"
        required: true
        default: "pro"
        type: choice
        options:
          - pro
          - basico

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: "us-east-1"
  LAMBDA_FUNCTION_PROD: "medrecord-api-prod"

jobs:
  upgrade-tenant:
    name: Upgrade tenant (${{ inputs.email }} → ${{ inputs.plan }})
    runs-on: ubuntu-latest
    environment: production  # Requiere aprobación manual vía GitHub Environment
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-deploy-prod
          aws-region: ${{ env.AWS_REGION }}

      - name: Invoke Lambda
        env:
          EMAIL: ${{ inputs.email }}
          TENANT_ID: ${{ inputs.tenant_id }}
          PLAN: ${{ inputs.plan }}
        run: |
          if [ -n "$TENANT_ID" ]; then
            PAYLOAD=$(jq -nc --arg t "$TENANT_ID" --arg p "$PLAN" '{upgrade_tenant_id: $t, plan: $p}')
            TARGET="tenant_id=${TENANT_ID}"
          elif [ -n "$EMAIL" ]; then
            PAYLOAD=$(jq -nc --arg e "$EMAIL" --arg p "$PLAN" '{upgrade_tenant: $e, plan: $p}')
            TARGET="email=${EMAIL}"
          else
            echo "❌ Debes proporcionar 'email' o 'tenant_id'."; exit 1
          fi
          echo "Invocando ${LAMBDA_FUNCTION_PROD} con payload: ${PAYLOAD}"
          aws lambda invoke --function-name "${LAMBDA_FUNCTION_PROD}" \
            --payload "${PAYLOAD}" \
            --cli-binary-format raw-in-base64-out \
            /tmp/upgrade_result.json
          echo "--- Resultado ---"
          cat /tmp/upgrade_result.json
          echo ""
          grep -q '"statusCode": 200' /tmp/upgrade_result.json \
            || { echo "❌ No se actualizó el plan (error del Lambda)."; exit 1; }
          echo "✅ Plan actualizado: ${TARGET} → ${PLAN}."
