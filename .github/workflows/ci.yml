name: CloudMedRecord CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: medrecord_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./backend

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip "setuptools>=83"
        pip install -e ".[dev]"
        pip install pip-audit
        
    - name: Security audit (Python)
      run: pip-audit
        
    - name: Check code formatting (Ruff)
      run: |
        ruff check .
        
    - name: Type checking (MyPy)
      run: |
        mypy app/

    # There is no staging environment: build and import the exact production
    # artifact in CI before any commit can reach the deployment workflow.
    - name: Verify production Lambda artifact
      run: >-
        python scripts/build_lambda_package.py
        --package-dir /tmp/lambda-package
        --zip-path /tmp/backend.zip
        --manifest-path /tmp/lambda-package-manifest.json
        
    - name: Create DB role for RLS
      env:
        PGPASSWORD: postgrespassword
      run: |
        psql -h localhost -U postgres -d medrecord_test -c \
          "CREATE ROLE medrecord_app WITH LOGIN PASSWORD 'apppassword';
           GRANT CONNECT ON DATABASE medrecord_test TO medrecord_app;"

    - name: Run Backend Tests (Pytest)
      env:
        DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@localhost:5432/medrecord_test
        JWT_DEV_SECRET: testing-secret-key-123
        CLERK_SECRET_KEY: testing-clerk-key-123
        ENVIRONMENT: development
      run: |
        pytest -v --cov=app --cov-report=xml

  # Executes every Alembic migration on real Postgres (pytest uses create_all,
  # which never runs the migration SQL: RLS policies, grants, triggers).
  migration-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: medrecord_migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./backend

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@localhost:5432/medrecord_migrations
      ENVIRONMENT: development

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip "setuptools>=83"
        pip install -e ".[dev]"

    - name: Create DB role for RLS
      env:
        PGPASSWORD: postgrespassword
      run: |
        psql -h localhost -U postgres -d medrecord_migrations -c \
          "CREATE ROLE medrecord_app WITH LOGIN PASSWORD 'apppassword';
           GRANT CONNECT ON DATABASE medrecord_migrations TO medrecord_app;"

    - name: Run full migration chain
      run: alembic upgrade head

    - name: Round-trip newest migration (downgrade -1, upgrade head)
      run: |
        alembic downgrade -1
        alembic upgrade head

    - name: Verify RLS tenant isolation on migrated schema
      run: PYTHONPATH=. python scripts/verify_rls.py

    # Runs the trigger/RLS-sensitive tests against the REAL migrated schema, not
    # create_all. This is the only place immutability triggers, FORCE RLS policies
    # and backfills are exercised as production runs them (§1.4). Every phase that
    # adds such behavior tags its regression test @pytest.mark.migration_schema.
    # This set includes the mandatory `firmar` regression (create → firmar →
    # verificar, test_firmar_regression.py) required by PLAN_EJECUCION_V2 §1 after
    # any phase touching notas/consentimientos — the descendant of the firmar-500
    # incident.
    - name: Run trigger/RLS + firmar regression tests on migrated schema
      env:
        JWT_DEV_SECRET: testing-secret-key-123
        CLERK_SECRET_KEY: testing-clerk-key-123
        TEST_SCHEMA_MODE: migrations
      run: pytest -m migration_schema -v

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
        
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'
        
    - name: Install dependencies
      run: npm ci
        
    - name: Security audit (Node)
      run: npm audit --audit-level=high

    - name: Lint Code (ESLint)
      run: npm run lint
        
    - name: Check Types (TSC)
      run: npm run typecheck

    - name: Run Frontend Tests (Vitest)
      run: npm test

    - name: Build Project
      env:
        VITE_API_URL: https://api.cloudmedrecord.test
        VITE_CLERK_PUBLISHABLE_KEY: pk_test_cloudmedrecord123
      run: npm run build

  security-evidence:
    name: SAST, secrets, IaC and SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Install scanners and application dependencies
      run: |
        python -m pip install --upgrade pip "setuptools>=83"
        python -m venv /tmp/medrecord-app-sbom
        /tmp/medrecord-app-sbom/bin/pip install ./backend
        pip install bandit==1.9.4 checkov==3.3.8 cyclonedx-bom==4.6.1
        npm ci --prefix frontend

    - name: Generate CycloneDX software bills of materials
      run: |
        mkdir -p security-artifacts
        cyclonedx-py environment /tmp/medrecord-app-sbom/bin/python --of JSON -o security-artifacts/backend-sbom.cdx.json
        npm sbom --prefix frontend --sbom-format cyclonedx > security-artifacts/frontend-sbom.cdx.json

    - name: Install verified Gitleaks binary
      env:
        GITLEAKS_VERSION: "8.30.1"
      run: |
        curl -sSfL -o /tmp/gitleaks.tar.gz \
          "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
        curl -sSfL -o /tmp/gitleaks_checksums.txt \
          "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
        EXPECTED=$(grep "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" /tmp/gitleaks_checksums.txt | cut -d' ' -f1)
        echo "${EXPECTED}  /tmp/gitleaks.tar.gz" | sha256sum --check --strict
        tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks

    - name: Secret scan (full Git history)
      run: /tmp/gitleaks git . --redact --no-banner --exit-code 1

    - name: SAST (high severity and confidence)
      run: bandit -r backend/app --severity-level high --confidence-level high

    - name: Terraform IaC policy scan
      # Existing infrastructure has a triaged baseline (including cost-increasing
      # HA/logging controls scheduled in later phases). Keep the full report as
      # evidence without hiding newly discovered checks behind a blanket skip list.
      run: >-
        checkov -d terraform --framework terraform --compact --soft-fail
        -o cli -o json --output-file-path console,security-artifacts/checkov.json

    - name: Upload SBOM evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: phase9-sbom-${{ github.sha }}
        path: security-artifacts/*
        if-no-files-found: error
        retention-days: 90
