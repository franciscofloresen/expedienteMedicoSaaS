name: CI — Tests + Security Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  TERRAFORM_VERSION: "1.7"

jobs:
  # ── Backend Tests ──
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: medrecord_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -e ".[dev]"

      - name: Run unit tests
        working-directory: backend
        run: pytest tests/unit/ -v --tb=short

      - name: Run NOM compliance tests
        working-directory: backend
        run: pytest tests/nom_compliance/ -v --tb=short

      - name: Run security tests
        working-directory: backend
        run: pytest tests/security/ -v --tb=short

      - name: Run integration tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/medrecord_test
          ENVIRONMENT: testing
        run: pytest tests/integration/ -v --tb=short

      - name: Coverage report
        working-directory: backend
        run: |
          pytest --cov=app --cov-report=xml tests/
          echo "## Test Coverage" >> $GITHUB_STEP_SUMMARY
          pytest --cov=app --cov-report=term-missing tests/ 2>&1 | tail -20 >> $GITHUB_STEP_SUMMARY

  # ── Terraform Validation ──
  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive terraform/

      - name: Terraform Validate (dev)
        working-directory: terraform/environments/dev
        run: |
          terraform init -backend=false
          terraform validate

  # ── Security Scanning ──
  security-scan:
    name: Security Scan (Checkov)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/
          framework: terraform
          output_format: github_failed_only
          soft_fail: false

  # ── Python Linting ──
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        working-directory: backend
        run: ruff check .

      - name: Ruff format check
        working-directory: backend
        run: ruff format --check .
