name: CD — Deploy to Staging / Production

# CRIT-08: Continuous Deployment pipeline.
# Triggers after CI passes on main branch.

on:
  workflow_run:
    workflows: ["CloudMedRecord CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: "us-east-1"
  RELEASE_SHA: "${{ github.event.workflow_run.head_sha || github.sha }}"
  LAMBDA_FUNCTION_PROD: "medrecord-api-prod"
  S3_LAMBDA_ARTIFACTS_PROD: "medrecord-lambda-artifacts-prod-${{ secrets.AWS_ACCOUNT_ID }}"
  LAMBDA_ARTIFACT_KEY: "lambda/medrecord-api-prod/${{ github.event.workflow_run.head_sha || github.sha }}/backend.zip"
  S3_FRONTEND_PROD: "medrecord-frontend-prod-${{ secrets.AWS_ACCOUNT_ID }}"
  CLOUDFRONT_DIST_PROD: ""  # Fill after first Terraform apply

jobs:
  # ── Gate: Only deploy if CI passed ──
  check-ci:
    name: Verify CI Success
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - run: echo "CI passed, proceeding with deployment"




  # ── Plan Infrastructure for Production ──
  plan-infrastructure-production:
    name: Plan Infrastructure → Production
    runs-on: ubuntu-latest
    needs: check-ci
    environment: production

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-deploy-prod
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Bootstrap Backend
        working-directory: terraform
        run: ./scripts/bootstrap-backend.sh

      - name: Terraform Init
        working-directory: terraform
        run: terraform init -backend-config=backend.hcl -backend-config="key=prod/terraform.tfstate"

      - name: Validate Clerk public configuration
        run: |
          if [ -z "${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}" ]; then
            echo "❌ ERROR: VITE_CLERK_PUBLISHABLE_KEY is missing from GitHub Secrets!"
            exit 1
          fi

      - name: Terraform Plan
        working-directory: terraform
        run: |
          B64_KEY=$(echo "${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}" | cut -d'_' -f3)
          ISSUER_DOMAIN=$(python3 -c "import base64, sys; print(base64.b64decode(sys.argv[1] + '=' * (-len(sys.argv[1]) % 4)).decode('utf-8').strip('$'))" "$B64_KEY")
          export TF_VAR_clerk_issuer_url="https://${ISSUER_DOMAIN}"
          export TF_VAR_clerk_jwks_url="https://${ISSUER_DOMAIN}/.well-known/jwks.json"
          export TF_VAR_acm_certificate_arn="${{ secrets.TF_VAR_ACM_CERTIFICATE_ARN }}"
          # Preserve the stage selected by Ops — Clinical Rollout. Without this,
          # every Terraform apply would silently reactivate the prod.tfvars default.
          CURRENT_STAGE=$(aws lambda get-function-configuration \
            --function-name "$LAMBDA_FUNCTION_PROD" \
            --query 'Environment.Variables.CLINICAL_ROLLOUT_STAGE' \
            --output text 2>/dev/null || true)
          if ! [[ "$CURRENT_STAGE" =~ ^[1-9]$ ]]; then CURRENT_STAGE=9; fi
          export TF_VAR_clinical_rollout_stage="$CURRENT_STAGE"
          terraform plan -var-file=prod.tfvars -out=tfplan

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-prod
          path: |
            terraform/tfplan
            terraform/modules/compute/dummy.zip

  # ── Apply Infrastructure to Production (Manual Approval) ──
  apply-infrastructure-production:
    name: Apply Infrastructure → Production
    runs-on: ubuntu-latest
    needs: plan-infrastructure-production
    environment: production  # Requires manual approval via GitHub Environment
    
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}

      # NOTE: Requerido por docs/runbooks/aurora_migration.md
      # Antes de aprobar este step, asegúrate de validar si hay migraciones destructivas 
      # de Aurora Serverless en el plan generado. Revisa el runbook antes de dar OK.
      - name: Check Runbook
        run: |
          echo "⚠️ Antes de aplicar, recuerda revisar docs/runbooks/aurora_migration.md para migraciones destructivas de BD."

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-deploy-prod
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-prod
          path: terraform

      - name: Terraform Init
        working-directory: terraform
        run: terraform init -backend-config=backend.hcl -backend-config="key=prod/terraform.tfstate"

      - name: Terraform Apply
        working-directory: terraform
        run: |
          B64_KEY=$(echo "${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}" | cut -d'_' -f3)
          ISSUER_DOMAIN=$(python3 -c "import base64, sys; print(base64.b64decode(sys.argv[1] + '=' * (-len(sys.argv[1]) % 4)).decode('utf-8').strip('$'))" "$B64_KEY")
          export TF_VAR_clerk_issuer_url="https://${ISSUER_DOMAIN}"
          export TF_VAR_clerk_jwks_url="https://${ISSUER_DOMAIN}/.well-known/jwks.json"
          export TF_VAR_acm_certificate_arn="${{ secrets.TF_VAR_ACM_CERTIFICATE_ARN }}"
          terraform apply tfplan

  # ── Enable Maintenance Page ──
  # Puts the static maintenance page live (as index.html) BEFORE the backend
  # deploy + DB migrations — the window where the app may be unavailable.
  # The frontend deploy job restores the real index.html at the end.
  enable-maintenance:
    name: Enable Maintenance Page
    runs-on: ubuntu-latest
    needs: apply-infrastructure-production
    environment: production

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-deploy-prod
          aws-region: ${{ env.AWS_REGION }}

      - name: Publish maintenance page
        run: |
          # Keep a stable copy, and serve it as index.html for the window.
          aws s3 cp frontend/public/maintenance.html \
            s3://${{ env.S3_FRONTEND_PROD }}/maintenance.html \
            --cache-control "no-cache,no-store,must-revalidate"
          aws s3 cp frontend/public/maintenance.html \
            s3://${{ env.S3_FRONTEND_PROD }}/index.html \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidate CloudFront (maintenance)
        if: env.CLOUDFRONT_DIST_PROD != ''
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DIST_PROD }} \
            --paths "/" "/index.html"

  # ── Deploy Backend to Production ──
  deploy-backend-production:
    name: Deploy Backend → Production
    runs-on: ubuntu-latest
    needs: [apply-infrastructure-production, enable-maintenance]
    environment: production

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Package Lambda
        working-directory: backend
        run: >-
          python scripts/build_lambda_package.py
          --package-dir /tmp/lambda-package
          --zip-path /tmp/backend.zip
          --manifest-path /tmp/lambda-package-manifest.json

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-deploy-prod
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to Lambda (Production)
        run: |
          aws s3 cp /tmp/backend.zip \
            "s3://${{ env.S3_LAMBDA_ARTIFACTS_PROD }}/${{ env.LAMBDA_ARTIFACT_KEY }}" \
            --sse AES256 \
            --only-show-errors
          aws lambda update-function-code \
            --function-name ${{ env.LAMBDA_FUNCTION_PROD }} \
            --s3-bucket ${{ env.S3_LAMBDA_ARTIFACTS_PROD }} \
            --s3-key ${{ env.LAMBDA_ARTIFACT_KEY }} \
            --publish

      - name: Wait for Lambda update
        run: |
          aws lambda wait function-updated \
            --function-name ${{ env.LAMBDA_FUNCTION_PROD }}

      - name: Run Database Migrations
        run: |
          aws lambda invoke --function-name ${{ env.LAMBDA_FUNCTION_PROD }} \
            --payload '{"run_migrations": true}' \
            --cli-binary-format raw-in-base64-out \
            /tmp/migration_result.json
          cat /tmp/migration_result.json
          grep -q "200" /tmp/migration_result.json || exit 1

      - name: Verify consent finalization invariants
        run: |
          aws lambda invoke --function-name ${{ env.LAMBDA_FUNCTION_PROD }} \
            --payload '{"verify":"consentimientos"}' \
            --cli-binary-format raw-in-base64-out \
            /tmp/consent_verify_result.json
          cat /tmp/consent_verify_result.json
          grep -q '"statusCode": 200' /tmp/consent_verify_result.json || exit 1

      - name: Verify Phase 9 security controls
        run: |
          aws lambda invoke --function-name ${{ env.LAMBDA_FUNCTION_PROD }} \
            --payload '{"verify":"fase9"}' \
            --cli-binary-format raw-in-base64-out \
            /tmp/fase9_verify_result.json
          jq '{statusCode, body: {ok: .body.ok, action: .body.action, checks: .body.checks, warnings: .body.warnings}}' \
            /tmp/fase9_verify_result.json
          jq -e '.statusCode == 200 and .body.ok == true' /tmp/fase9_verify_result.json >/dev/null

      - name: Install dependencies for Smoke Test
        working-directory: backend
        run: pip install .

      - name: Run Smoke Test
        working-directory: backend
        run: PYTHONPATH=. python3 scripts/smoke_test.py

      - name: Remove transient Lambda artifact
        if: always()
        run: >-
          aws s3 rm
          "s3://${{ env.S3_LAMBDA_ARTIFACTS_PROD }}/${{ env.LAMBDA_ARTIFACT_KEY }}"
          --only-show-errors

  # ── Verify Clinical File Storage end-to-end (Production) ──
  # Exercises the real presigned POST → KMS → GuardDuty scan → gated download
  # cycle from inside the deployed Lambda. Runs parallel to the frontend
  # restore so a verification failure never strands the maintenance page.
  verify-storage-production:
    name: Verify Clinical File Storage → Production
    runs-on: ubuntu-latest
    needs: deploy-backend-production
    environment: production

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-deploy-prod
          aws-region: ${{ env.AWS_REGION }}

      - name: CORS preflight against clinical bucket
        run: |
          BUCKET="medrecord-expedientes-prod-${{ secrets.AWS_ACCOUNT_ID }}"
          curl -s -D /tmp/cors_headers.txt -o /dev/null -X OPTIONS \
            -H "Origin: https://cloudmedrecord.com" \
            -H "Access-Control-Request-Method: POST" \
            "https://${BUCKET}.s3.${{ env.AWS_REGION }}.amazonaws.com/"
          if grep -qi "access-control-allow-origin: https://cloudmedrecord.com" /tmp/cors_headers.txt; then
            echo "✅ CORS allows browser uploads from https://cloudmedrecord.com"
          else
            echo "❌ CORS preflight failed — browser uploads would be blocked:"
            cat /tmp/cors_headers.txt
            exit 1
          fi

      - name: Upload probe via presigned POST
        run: |
          aws lambda invoke --function-name ${{ env.LAMBDA_FUNCTION_PROD }} \
            --payload '{"verify_file_storage": "upload"}' \
            --cli-binary-format raw-in-base64-out \
            /tmp/upload.json
          cat /tmp/upload.json
          python3 - <<'EOF'
          import json, sys
          result = json.load(open("/tmp/upload.json"))
          if result.get("statusCode") != 200:
              sys.exit("probe upload failed")
          print(f"S3_KEY={result['body']['s3_key']}")
          with open("/tmp/s3_key", "w") as f:
              f.write(result["body"]["s3_key"])
          EOF
          echo "S3_KEY=$(cat /tmp/s3_key)" >> "$GITHUB_ENV"

      - name: Wait for GuardDuty scan and verify gated download
        run: |
          for attempt in $(seq 1 24); do
            aws lambda invoke --function-name ${{ env.LAMBDA_FUNCTION_PROD }} \
              --payload "{\"verify_file_storage\": \"check\", \"s3_key\": \"${S3_KEY}\"}" \
              --cli-binary-format raw-in-base64-out \
              /tmp/check.json
            cat /tmp/check.json
            OUTCOME=$(python3 -c '
          import json
          result = json.load(open("/tmp/check.json"))
          body = result.get("body") or {}
          if result.get("statusCode") != 200:
              print("failed")
          elif isinstance(body, dict) and body.get("download_verified"):
              print("verified")
          else:
              print("pending")
          ')
            if [ "$OUTCOME" = "verified" ]; then
              echo "✅ Storage pipeline verified: upload, KMS, GuardDuty scan, gated download"
              exit 0
            fi
            if [ "$OUTCOME" = "failed" ]; then
              echo "❌ Storage verification failed (see output above)"
              exit 1
            fi
            echo "Scan pending (attempt ${attempt}/24), retrying in 15s..."
            sleep 15
          done
          echo "❌ GuardDuty scan did not complete within 6 minutes"
          exit 1

  # ── Deploy Frontend to Production ──
  deploy-frontend-production:
    name: Deploy Frontend → Production
    runs-on: ubuntu-latest
    needs: deploy-backend-production
    environment: production

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-deploy-prod
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and Build
        working-directory: frontend
        run: |
          API_ID=$(aws apigateway get-rest-apis --query "items[?name=='medrecord-api-prod'].id" --output text)
          export VITE_API_URL="https://${API_ID}.execute-api.${{ env.AWS_REGION }}.amazonaws.com/v1/api/v1"
          export VITE_CLERK_PUBLISHABLE_KEY="${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}"
          npm ci
          npm run build

      - name: Sync to S3 (Production)
        run: |
          # Upload new hashed assets (index.html stays on the maintenance page
          # during the sync). maintenance.html is in dist/ so --delete keeps it.
          aws s3 sync frontend/dist/ s3://${{ env.S3_FRONTEND_PROD }}/ \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html"
          # Restore the real app index.html — this DISABLES the maintenance page.
          aws s3 cp frontend/dist/index.html s3://${{ env.S3_FRONTEND_PROD }}/index.html \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidate CloudFront (Production)
        if: env.CLOUDFRONT_DIST_PROD != ''
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DIST_PROD }} \
            --paths "/*"
