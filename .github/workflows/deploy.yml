name: CD — Deploy to Staging / Production

# CRIT-08: Continuous Deployment pipeline.
# Triggers after CI passes on main branch.

on:
  workflow_run:
    workflows: ["CI — Tests + Security Scan"]
    types: [completed]
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: "us-east-1"
  LAMBDA_FUNCTION_DEV: "medrecord-api-dev"
  LAMBDA_FUNCTION_PROD: "medrecord-api-prod"
  S3_FRONTEND_DEV: "medrecord-frontend-dev"
  S3_FRONTEND_PROD: "medrecord-frontend-prod"
  CLOUDFRONT_DIST_DEV: ""   # Fill after first Terraform apply
  CLOUDFRONT_DIST_PROD: ""  # Fill after first Terraform apply

jobs:
  # ── Gate: Only deploy if CI passed ──
  check-ci:
    name: Verify CI Success
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - run: echo "CI passed, proceeding with deployment"

  # ── Deploy Backend to Staging ──
  deploy-backend-staging:
    name: Deploy Backend → Staging
    runs-on: ubuntu-latest
    needs: check-ci
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -e ".[dev]"

      - name: Package Lambda
        working-directory: backend
        run: |
          mkdir -p /tmp/lambda-package
          pip install -t /tmp/lambda-package .
          cp -r app /tmp/lambda-package/
          cd /tmp/lambda-package && zip -r /tmp/backend.zip . -x "*.pyc" "__pycache__/*"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to Lambda (Staging)
        run: |
          aws lambda update-function-code \
            --function-name ${{ env.LAMBDA_FUNCTION_DEV }} \
            --zip-file fileb:///tmp/backend.zip \
            --publish

      - name: Wait for Lambda update
        run: |
          aws lambda wait function-updated \
            --function-name ${{ env.LAMBDA_FUNCTION_DEV }}

  # ── Deploy Frontend to Staging ──
  deploy-frontend-staging:
    name: Deploy Frontend → Staging
    runs-on: ubuntu-latest
    needs: check-ci
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and Build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3 (Staging)
        run: |
          aws s3 sync frontend/dist/ s3://${{ env.S3_FRONTEND_DEV }}/ \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html"
          # index.html should not be cached
          aws s3 cp frontend/dist/index.html s3://${{ env.S3_FRONTEND_DEV }}/index.html \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidate CloudFront (Staging)
        if: env.CLOUDFRONT_DIST_DEV != ''
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DIST_DEV }} \
            --paths "/*"

  # ── Smoke Tests ──
  smoke-test:
    name: Smoke Test (Staging)
    runs-on: ubuntu-latest
    needs: [deploy-backend-staging, deploy-frontend-staging]

    steps:
      - name: Health Check
        run: |
          # Wait for deployment to stabilize
          sleep 10

          # Test API health endpoint
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://${{ vars.STAGING_API_URL }}/health" \
            --max-time 30)

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "❌ Health check failed with status: $HTTP_STATUS"
            exit 1
          fi

          echo "✅ Health check passed (HTTP $HTTP_STATUS)"

  # ── Deploy to Production (Manual Approval) ──
  deploy-backend-production:
    name: Deploy Backend → Production
    runs-on: ubuntu-latest
    needs: smoke-test
    environment: production  # Requires manual approval via GitHub Environment

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Package Lambda
        working-directory: backend
        run: |
          mkdir -p /tmp/lambda-package
          pip install -t /tmp/lambda-package .
          cp -r app /tmp/lambda-package/
          cd /tmp/lambda-package && zip -r /tmp/backend.zip . -x "*.pyc" "__pycache__/*"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-deploy-prod
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to Lambda (Production)
        run: |
          aws lambda update-function-code \
            --function-name ${{ env.LAMBDA_FUNCTION_PROD }} \
            --zip-file fileb:///tmp/backend.zip \
            --publish

      - name: Wait for Lambda update
        run: |
          aws lambda wait function-updated \
            --function-name ${{ env.LAMBDA_FUNCTION_PROD }}

  deploy-frontend-production:
    name: Deploy Frontend → Production
    runs-on: ubuntu-latest
    needs: smoke-test
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and Build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-deploy-prod
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3 (Production)
        run: |
          aws s3 sync frontend/dist/ s3://${{ env.S3_FRONTEND_PROD }}/ \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html"
          aws s3 cp frontend/dist/index.html s3://${{ env.S3_FRONTEND_PROD }}/index.html \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidate CloudFront (Production)
        if: env.CLOUDFRONT_DIST_PROD != ''
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DIST_PROD }} \
            --paths "/*"
