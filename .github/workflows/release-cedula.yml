name: Ops — Release Cédula (Production)

# Operación administrativa puntual y auditada contra la BD privada (vía Lambda VPC).
#   action=inspect (por defecto, SOLO LECTURA): reporta identidad del tenant y
#     cuántas filas hijas tiene. No modifica nada.
#   action=release: borra el tenant para liberar la cédula. NO borra tenants con
#     datos clínicos (el DELETE viola las FK y se aborta con 409).

on:
  workflow_dispatch:
    inputs:
      cedula:
        description: "Cédula del tenant en producción"
        required: true
        type: string
      action:
        description: "inspect (solo lectura) o release (borra el tenant)"
        required: true
        default: "inspect"
        type: choice
        options:
          - inspect
          - release

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: "us-east-1"
  LAMBDA_FUNCTION_PROD: "medrecord-api-prod"

jobs:
  cedula-op:
    name: Cédula op (${{ inputs.action }}) in Production DB
    runs-on: ubuntu-latest
    environment: production  # Requiere aprobación manual vía GitHub Environment
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-deploy-prod
          aws-region: ${{ env.AWS_REGION }}

      - name: Invoke Lambda
        env:
          CEDULA: ${{ inputs.cedula }}
          ACTION: ${{ inputs.action }}
        run: |
          KEY="${ACTION}_cedula"   # inspect_cedula | release_cedula
          PAYLOAD=$(jq -nc --arg k "$KEY" --arg c "$CEDULA" '{($k): $c}')
          echo "Invocando ${LAMBDA_FUNCTION_PROD} con payload: ${PAYLOAD}"
          aws lambda invoke --function-name "${LAMBDA_FUNCTION_PROD}" \
            --payload "${PAYLOAD}" \
            --cli-binary-format raw-in-base64-out \
            /tmp/cedula_result.json
          echo "--- Resultado ---"
          cat /tmp/cedula_result.json
          echo ""
          if [ "$ACTION" = "inspect" ]; then
            # Solo lectura: siempre es informativo, no falla el job.
            grep -q '"statusCode": 200' /tmp/cedula_result.json || { echo "❌ La inspección falló (error del Lambda)."; exit 1; }
            echo "✅ Inspección completada (revisa related_rows arriba)."
          else
            grep -q '"statusCode": 200' /tmp/cedula_result.json || { echo "❌ No se liberó la cédula (probablemente tiene datos: revisa el desglose arriba)."; exit 1; }
            echo "✅ Cédula liberada correctamente."
          fi
