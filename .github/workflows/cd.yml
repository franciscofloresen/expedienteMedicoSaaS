name: Deploy to AWS (Dev)

on:
  push:
    branches: [ "develop" ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Lambda Package
        run: |
          cd backend
          mkdir -p package
          # Install dependencies into package folder
          pip install --target ./package .
          # Copy app files
          cp -r app package/
          cp -r alembic package/
          cp alembic.ini package/
          # Create zip
          cd package
          zip -rq9 ../deployment.zip .
          cd ..

      - name: Deploy to Lambda
        run: |
          aws lambda update-function-code \
            --function-name medrecord-api-dev \
            --zip-file fileb://backend/deployment.zip
          
          # Wait for lambda update to finish
          aws lambda wait function-updated --function-name medrecord-api-dev

      - name: Run Database Migrations
        run: |
          aws lambda invoke \
            --function-name medrecord-api-dev \
            --payload '{"run_migrations": true}' \
            --cli-binary-format raw-in-base64-out \
            response.json
          cat response.json
          grep -q "successful" response.json || exit 1

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Build and Sync
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
        run: |
          cd frontend
          npm ci
          npm run build
          
          # Fetch Terraform outputs (in a real scenario we'd use terraform output or SSM)
          # For now, we will use the outputs we got locally.
          
          # We need the S3 bucket and CloudFront Dist ID. We can extract them via AWS CLI
          FRONTEND_BUCKET=$(aws s3api list-buckets --query "Buckets[?starts_with(Name, 'medrecord-frontend-dev')].Name" --output text)
          DIST_ID=$(aws cloudfront list-distributions --query "DistributionList.Items[?contains(Aliases.Items, 'your-domain') || starts_with(Origins.Items[0].DomainName, 'medrecord-frontend-dev')].Id" --output text | head -n 1)
          
          aws s3 sync dist/ s3://$FRONTEND_BUCKET --delete
          if [ -n "$DIST_ID" ] && [ "$DIST_ID" != "None" ]; then
            aws cloudfront create-invalidation --distribution-id $DIST_ID --paths "/*"
          fi
