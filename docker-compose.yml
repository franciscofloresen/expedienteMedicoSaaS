version: '3.8'

services:
  postgres:
    image: postgres:15.4-alpine
    container_name: medrecord-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: medrecord
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d medrecord"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
